<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed - Bittrif Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Bittrif <span>Shop</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-count">0</span></a>
    </div>
  </nav>

  <div class="container" style="max-width:600px;text-align:center;padding-top:4rem">
    <div style="font-size:5rem">✅</div>
    <h1 style="margin:1rem 0;color:#065f46">Order Placed Successfully!</h1>
    <p style="color:#64748b;margin-bottom:2rem">Thank you for your order. We'll deliver it soon.</p>
    <div class="card" id="orderInfo" style="text-align:left;margin-bottom:2rem"></div>
    <div style="display:flex;gap:1rem;justify-content:center">
      <a href="index.html" class="btn btn-primary">Continue Shopping</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (id) {
      fetch(`${API}/orders/${id}`).then(r => r.json()).then(order => {
        document.getElementById('orderInfo').innerHTML = `
          <p><strong>Order ID:</strong> #${order.id}</p>
          <p><strong>Name:</strong> ${order.customer_name}</p>
          <p><strong>Email:</strong> ${order.customer_email}</p>
          <p><strong>Address:</strong> ${order.address}</p>
          <p><strong>Total:</strong> ${formatPrice(order.total)}</p>
          <p><strong>Status:</strong> <span class="badge badge-pending">Pending</span></p>`;
      });
    }
  </script>
</body>
</html>
