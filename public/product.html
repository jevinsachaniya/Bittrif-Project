<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - Bittrif Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Bittrif <span>Shop</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-count">0</span></a>
    </div>
  </nav>

  <div class="container">
    <a href="products.html" style="color:#6366f1;text-decoration:none;font-size:.9rem">← Back to Products</a>
    <div id="productDetail" style="margin-top:2rem"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = 'products.html';

    fetch(`${API}/products/${id}`).then(r => r.json()).then(p => {
      document.title = `${p.name} - Bittrif Shop`;
      document.getElementById('productDetail').innerHTML = `
        <div class="product-detail">
          <img src="${p.image}" alt="${p.name}">
          <div>
            <span class="cat-badge">${p.category_name || 'General'}</span>
            <h1 style="font-size:1.8rem;margin-top:.5rem">${p.name}</h1>
            <div class="price">${formatPrice(p.price)}</div>
            <p class="desc">${p.description || 'No description available.'}</p>
            <p style="color:#64748b;font-size:.9rem;margin-bottom:1.5rem">Stock: ${p.stock} units available</p>
            <div style="display:flex;gap:1rem">
              <button class="btn btn-primary" onclick='addToCart(${JSON.stringify(p)})'>🛒 Add to Cart</button>
              <a href="cart.html" class="btn btn-outline">View Cart</a>
            </div>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
