<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Bittrif Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Bittrif <span>Shop</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-count">0</span></a>
    </div>
  </nav>

  <div class="container">
    <h2 class="section-title">Shopping Cart</h2>
    <div id="cartContent"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cartContent');
      if (!cart.length) {
        container.innerHTML = `<div class="empty"><div class="icon">🛒</div><p>Your cart is empty</p><a href="products.html" class="btn btn-primary" style="margin-top:1rem">Shop Now</a></div>`;
        return;
      }
      const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
      const shipping = subtotal > 999 ? 0 : 99;
      container.innerHTML = `
        <div class="cart-layout">
          <div>
            ${cart.map(item => `
              <div class="cart-item">
                <img src="${item.image}" alt="${item.name}">
                <div class="cart-item-info">
                  <h4>${item.name}</h4>
                  <div style="color:#6366f1;font-weight:700">${formatPrice(item.price)}</div>
                  <div class="qty-control">
                    <button onclick="changeQty(${item.id}, -1)">−</button>
                    <span>${item.quantity}</span>
                    <button onclick="changeQty(${item.id}, 1)">+</button>
                    <button onclick="removeItem(${item.id})" style="margin-left:.5rem;background:#fee2e2;border-color:#fca5a5;color:#ef4444">🗑</button>
                  </div>
                </div>
                <div style="font-weight:700">${formatPrice(item.price * item.quantity)}</div>
              </div>`).join('')}
          </div>
          <div class="order-summary">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : formatPrice(shipping)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatPrice(subtotal + shipping)}</span></div>
            ${shipping > 0 ? `<p style="font-size:.8rem;color:#64748b;margin-bottom:1rem">Add ${formatPrice(999 - subtotal)} more for free shipping</p>` : ''}
            <a href="checkout.html" class="btn btn-primary btn-full">Proceed to Checkout</a>
            <a href="products.html" class="btn btn-outline btn-full" style="margin-top:.7rem">Continue Shopping</a>
          </div>
        </div>`;
    }

    function changeQty(id, delta) {
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if (item) { item.quantity += delta; if (item.quantity <= 0) cart.splice(cart.indexOf(item), 1); }
      saveCart(cart);
      renderCart();
    }

    function removeItem(id) {
      saveCart(getCart().filter(i => i.id !== id));
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
