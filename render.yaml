services:
  - type: web
    name: bittrif-group-store
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && cd client && npm ci && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bittrif-store-data
      mountPath: /var/data
      sizeGB: 1
